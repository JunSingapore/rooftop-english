<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rooftop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rooftop English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Young+Serif&display=swap">
<style>
:root {
  --ground: #ECEFF3;
  --surface: #FFFFFF;
  --ink: #1A2130;
  --muted: #586577;
  --line: #D2D9E2;
  --slate: #2B4565;
  --on-slate: #FFFFFF;
  --lamp: #F0A43A;
  --lamp-soft: #FCEBD0;
  --lamp-ink: #8A5200;
  --good: #1F7A55;
  --good-bg: #E2F2EA;
  --bad: #B3372F;
  --bad-bg: #FAE6E3;
  --bld: #A3B0C1;
  --roof: #5E6D82;
  --win: #D3DAE4;
  --win-on: #F0A43A;
  --display: "Young Serif", "Iowan Old Style", Georgia, serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10151F; --surface: #19202D; --ink: #E6EBF2; --muted: #9BA7B7; --line: #2A3446;
    --slate: #9DBBE0; --on-slate: #0F1622; --lamp: #F4AE4A; --lamp-soft: #3A2C14; --lamp-ink: #F4B962;
    --good: #62C99C; --good-bg: #14302A; --bad: #EF8076; --bad-bg: #3A1C1A;
    --bld: #243048; --roof: #33415A; --win: #1A2232; --win-on: #F4AE4A;
  }
}
:root[data-theme="dark"] {
  --ground: #10151F; --surface: #19202D; --ink: #E6EBF2; --muted: #9BA7B7; --line: #2A3446;
  --slate: #9DBBE0; --on-slate: #0F1622; --lamp: #F4AE4A; --lamp-soft: #3A2C14; --lamp-ink: #F4B962;
  --good: #62C99C; --good-bg: #14302A; --bad: #EF8076; --bad-bg: #3A1C1A;
  --bld: #243048; --roof: #33415A; --win: #1A2232; --win-on: #F4AE4A;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 56px; display: flex; flex-direction: column; gap: 28px; }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 40px; letter-spacing: -0.01em; }
h2 { font-size: 28px; }
h3 { font-size: 22px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.eyebrow { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ── buttons ── */
.btn {
  min-height: 56px; padding: 0 26px; border-radius: 999px; border: 2px solid transparent;
  font-weight: 700; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--slate); color: var(--on-slate); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.btn.small { min-height: 44px; font-size: 16px; padding: 0 18px; }
.btn.danger { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.linkish { background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ── skyline ── */
.skyline { width: 100%; height: auto; display: block; }
.skyline .bld { fill: var(--bld); }
.skyline .roof { fill: var(--roof); }
.skyline .win { fill: var(--win); transition: fill 700ms ease; }
.skyline .win.on { fill: var(--win-on); }
.skyline .day { fill: var(--muted); font: 700 13px var(--body); letter-spacing: 0.06em; text-transform: uppercase; }
.skyline .day.today { fill: var(--ink); }
.skyline .street { fill: var(--roof); }

/* ── home ── */
.masthead { display: flex; flex-direction: column; gap: 6px; }
.masthead p { font-size: 19px; color: var(--muted); }
.week-note { font-size: 15px; color: var(--muted); margin-top: -18px; text-align: right; font-variant-numeric: tabular-nums; }
.today {
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  padding: 26px; display: grid; grid-template-columns: 1fr auto; gap: 18px 24px; align-items: center;
}
.today .facts { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.today .facts strong { color: var(--ink); }
@media (max-width: 600px) { .today { grid-template-columns: 1fr; } .today .btn { width: 100%; } }

.units { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.unit {
  display: grid; grid-template-columns: 1fr 150px auto; gap: 8px 20px; align-items: center;
  padding: 18px 0; border-top: 1px solid var(--line);
}
.unit:last-child { border-bottom: 1px solid var(--line); }
.unit .t { display: flex; flex-direction: column; gap: 2px; }
.unit .t .name { font-family: var(--display); font-size: 21px; line-height: 1.25; }
.unit .t .ja { font-size: 15px; color: var(--muted); }
.chip { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; margin-bottom: 4px; border: 1px solid transparent; }
.chip.next { background: var(--lamp-soft); color: var(--lamp-ink); }
.chip.review { border-color: var(--slate); color: var(--slate); }
.chip.bank { border-color: var(--line); color: var(--muted); }
.meter { display: flex; flex-direction: column; gap: 5px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lamp); border-radius: 3px; }
@media (max-width: 600px) {
  .unit { grid-template-columns: 1fr auto; }
  .unit .meter { grid-column: 1 / -1; grid-row: 2; }
}
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ── quiz ── */
.topbar { display: flex; align-items: center; gap: 16px; }
.segs { flex: 1; display: flex; gap: 4px; }
.segs i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.segs i.ok { background: var(--good); }
.segs i.no { background: var(--bad); }
.segs i.cur { background: var(--lamp); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); min-width: 56px; text-align: right; }
.timer.over { color: var(--lamp-ink); }

.stage { display: flex; flex-direction: column; gap: 22px; }
.q { font-size: 25px; line-height: 1.45; text-wrap: pretty; }
.blank {
  display: inline-block; min-width: 4.2em; border-bottom: 3px solid var(--ink);
  padding: 0 4px; line-height: 1.1; text-align: center;
}
.blank.filled { border-color: var(--good); color: var(--good); font-weight: 700; }
.opts { display: grid; grid-template-columns: 1fr; gap: 12px; }
.opts.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .opts.two { grid-template-columns: 1fr; } }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left;
  min-height: 64px; padding: 14px 18px; border-radius: 16px;
  background: var(--surface); border: 2px solid var(--line); font-size: 20px; line-height: 1.35;
  user-select: none; -webkit-user-select: none;
}
.opt .key {
  flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; font-weight: 700; background: var(--ground); color: var(--muted);
}
.opt .txt { flex: 1; }
.opt .mark { flex: none; font-weight: 700; font-size: 22px; }
.opt:disabled { opacity: 1; color: var(--ink); cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .key { background: var(--good); color: var(--surface); }
.opt.correct .mark { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.opt.wrong .mark { color: var(--bad); }
.opt.dim { opacity: 0.5; }
@media (hover: hover) { .opt:not(:disabled):hover { border-color: var(--slate); } }
.opt:not(:disabled):active { transform: scale(0.99); }

.hintbox { background: var(--lamp-soft); color: var(--ink); border-radius: 14px; padding: 14px 18px; font-size: 18px; }
.feedback { border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; border: 2px solid; }
.feedback.ok { background: var(--good-bg); border-color: var(--good); }
.feedback.no { background: var(--bad-bg); border-color: var(--bad); }
.fb-title { font-family: var(--display); font-size: 24px; }
.feedback.ok .fb-title { color: var(--good); }
.feedback.no .fb-title { color: var(--bad); }
.feedback .btn { align-self: flex-end; margin-top: 4px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;
}
.card .word { font-family: var(--display); font-size: 48px; line-height: 1.05; }
.card .ex { font-size: 21px; font-style: italic; color: var(--muted); }
.card .ex strong { color: var(--ink); font-style: normal; }
.card .def { font-size: 21px; }
.card .ja { font-size: 18px; color: var(--lamp-ink); font-weight: 700; }

.speak { background: var(--surface); border: 1px dashed var(--roof); border-radius: 22px; padding: 30px 28px; display: flex; flex-direction: column; gap: 16px; }

/* ── end ── */
.score { font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.score span { font-size: 28px; color: var(--muted); }
.recap { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.recap li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.recap .a { color: var(--good); font-weight: 700; }

/* ── parent ── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 32px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 14px; color: var(--muted); }
@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.skill-row { display: grid; grid-template-columns: 180px 1fr 92px; gap: 12px; align-items: center; font-size: 16px; }
.skill-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.skill-row .bar { height: 10px; border-radius: 5px; }
.skill-row .bar i.low { background: var(--bad); }
.skill-row .bar i.mid { background: var(--lamp); }
.skill-row .bar i.hi { background: var(--good); }
@media (max-width: 600px) { .skill-row { grid-template-columns: 1fr 80px; } .skill-row .bar { grid-column: 1 / -1; grid-row: 2; } }
.missed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.missed li { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 16px; }
.missed .cnt { color: var(--bad); font-weight: 700; font-variant-numeric: tabular-nums; }
.src { font-size: 15px; color: var(--muted); }
.src li { margin-bottom: 4px; }
textarea { width: 100%; min-height: 120px; font: 13px/1.4 ui-monospace, Menlo, monospace; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); }
.note { font-size: 15px; color: var(--muted); }
.msg { font-size: 15px; color: var(--good); font-weight: 700; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app"></div>

<script src="content.js"></script>
<script>
(function () {
  "use strict";
  var C = window.RE_CONTENT;
  var app = document.getElementById("app");
  if (!C) { app.innerHTML = '<div class="wrap"><p>問題データ（content.js）が読み込めませんでした。</p></div>'; return; }

  var KEY = "rooftop-english-v1";
  var INTERVAL = [0, 1, 3, 7, 14, 30];   // Leitner: box → 次に出すまでの日数
  var LIMIT = 12;                          // 1回の問題数
  var MAX_SECS = 600;                      // 10分で打ち止め（延長しない）
  var DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  var byId = {}; C.items.forEach(function (it) { byId[it.id] = it; });
  var unitById = {}; C.units.forEach(function (u) { unitById[u.id] = u; });

  /* ── storage ── */
  var storageOk = true;
  function fresh() { return { items: {}, days: [], sessions: [], follow: [], spoken: 0 }; }
  function normalize(s) {
    s.items = s.items || {}; s.days = s.days || []; s.sessions = s.sessions || [];
    s.follow = (s.follow || []).filter(function (f) { return f && typeof f === "object" && f.skill; });
    s.spoken = s.spoken || 0; return s;
  }
  // バックアップ読み込み時の検証（壊れたデータで記録を上書きしない）
  function validState(s) {
    if (!s || typeof s !== "object") return false;
    if (!s.items || typeof s.items !== "object" || Array.isArray(s.items)) return false;
    if (!Array.isArray(s.days) || !Array.isArray(s.sessions)) return false;
    if (s.follow != null && !Array.isArray(s.follow)) return false;
    for (var id in s.items) {
      var r = s.items[id];
      if (!r || typeof r !== "object" || typeof r.box !== "number" || typeof r.due !== "string") return false;
    }
    for (var i = 0; i < s.sessions.length; i++) {
      var x = s.sessions[i];
      if (!x || typeof x.d !== "string" || !Array.isArray(x.res)) return false;
    }
    return s.days.every(function (d) { return typeof d === "string"; });
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var s = raw ? JSON.parse(raw) : null;
      if (s && s.items) return normalize(s);
    } catch (e) { storageOk = false; }
    return fresh();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; }
  }
  var S = load();

  /* ── dates ── */
  function ymd(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function today() { return ymd(new Date()); }
  function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
  function monday() { var d = new Date(); var wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); d.setHours(0, 0, 0, 0); return d; }

  /* ── helpers ── */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function rec(id) { return S.items[id]; }
  function isDue(id) { var r = rec(id); return !!(r && r.due && r.due <= today()); }
  function doneToday(id) { var r = rec(id); return !!(r && r.last === today()); }
  function mastered(id) { var r = rec(id); return !!(r && r.box >= 3); }
  function correctText(it) { return it.type === "card" ? it.word : it.options[it.a]; }
  function promptText(it) { return it.type === "card" ? it.word + " — " + it.def : it.q; }

  function record(id, ok) {
    var r = S.items[id] || { box: 0, seen: 0, right: 0, wrong: 0 };
    r.seen++; r.last = today();
    if (ok) { r.right++; r.box = Math.min(5, Math.max(1, r.box) + 1); r.due = addDays(INTERVAL[r.box]); }
    else {
      r.wrong++; r.box = 1; r.due = addDays(1);   // 間違えたら翌日以降（その場で延長しない）
      // 同じ技能の「別の問題」で次回確認する予約（元の問題そのものは翌日の復習で出る）
      var sk = byId[id].skill;
      if (!S.follow.some(function (f) { return f.skill === sk && f.from === id; })) S.follow.push({ skill: sk, from: id });
      if (S.follow.length > 8) S.follow.shift();
    }
    S.items[id] = r;
    if (S.days.indexOf(today()) < 0) { S.days.push(today()); if (S.days.length > 400) S.days.shift(); }
    save();
  }

  // 未出題 → 箱の低い順 → 期日前は後回し（同点はランダム）
  function rank(list) {
    function score(it) { var r = rec(it.id); if (!r) return 0; return 1 + r.box * 10 + (isDue(it.id) ? 0 : 5); }
    return shuffle(list.slice()).sort(function (a, b) { return score(a) - score(b); });
  }

  /* ── session building ── */
  function builder() {
    var picked = [];
    function has(id) { for (var i = 0; i < picked.length; i++) if (picked[i].id === id) return true; return false; }
    // 今日すでに答えた問題は出さない（誤答は翌日以降に回す）
    function addFrom(list, n, why, extra) {
      var k = 0;
      for (var i = 0; i < list.length && k < n && picked.length < LIMIT; i++) {
        var it = list[i];
        if (!has(it.id) && !doneToday(it.id)) { picked.push({ id: it.id, why: why, follow: extra }); k++; }
      }
    }
    // 誤答の予約：同じ技能の、元とは別の問題を1問ずつ
    function addFollowups(scope, n) {
      S.follow.filter(function (f) { return !scope || scope.indexOf(f.skill) >= 0; }).slice(0, n).forEach(function (f) {
        addFrom(rank(C.items.filter(function (it) { return it.skill === f.skill && it.id !== f.from; })), 1, "followup", f);
      });
    }
    return { picked: picked, has: has, addFrom: addFrom, addFollowups: addFollowups };
  }

  function buildMix() {
    var b = builder();
    var due = C.items.filter(function (it) { return isDue(it.id); })
      .sort(function (x, y) { return rec(x.id).due < rec(y.id).due ? -1 : 1; });
    b.addFrom(due, 4, "review");
    b.addFollowups(null, 3);
    var nextU = C.units.filter(function (u) { return u.status === "next"; }).map(function (u) { return u.id; });
    var revU = C.units.filter(function (u) { return u.status === "review"; }).map(function (u) { return u.id; });
    function from(units) { return rank(C.items.filter(function (it) { return units.indexOf(it.unit) >= 0; })); }
    b.addFrom(from(nextU), 5, "new");
    b.addFrom(from(revU), 2, "new");
    b.addFrom(from(["spelling"]), 2, "new");
    b.addFrom(from(["grammar"]), 1, "new");
    b.addFrom(rank(C.items), LIMIT, "new");
    if (!b.picked.length) return null;
    var q = shuffle(b.picked);
    var main = nextU.filter(function (u) { return q.some(function (p) { return byId[p.id].unit === u; }); })[0] || byId[q[0].id].unit;
    return { mode: "mix", unit: main, queue: q };
  }

  function buildUnit(uid) {
    var b = builder();
    var items = C.items.filter(function (it) { return it.unit === uid; });
    var skills = items.map(function (it) { return it.skill; });
    b.addFrom(items.filter(function (it) { return isDue(it.id); }), LIMIT, "review");
    b.addFollowups(skills, 3);
    b.addFrom(rank(items), LIMIT, "new");
    if (!b.picked.length) return null;
    return { mode: "unit", unit: uid, queue: shuffle(b.picked) };
  }

  function startSession(s) {
    if (!s) { ui = { homeMsg: "This topic is done for today — every question has been answered. Come back tomorrow!" }; go("home"); return; }
    var u = unitById[s.unit];
    var prompts = (u && u.speak) || [];
    s.speak = prompts.length ? prompts[S.spoken % prompts.length] : null;
    s.i = 0; s.answers = []; s.start = Date.now(); s.phase = "items";
    sess = s; ui = {}; go("quiz");
  }

  /* ── view state ── */
  var view = "home", sess = null, ui = {};
  function go(v) { view = v; render(); window.scrollTo(0, 0); }

  function render() {
    if (view === "quiz") app.innerHTML = quizHTML();
    else if (view === "end") app.innerHTML = endHTML();
    else if (view === "parent") app.innerHTML = parentHTML();
    else app.innerHTML = homeHTML();
    if (view === "end") setTimeout(function () {
      var w = app.querySelectorAll(".win.pending"); for (var i = 0; i < w.length; i++) w[i].classList.add("on");
    }, 250);
  }

  /* ── skyline: this week, one building per day; practised days light up ── */
  function skyline(pendingToday) {
    var mon = monday(), H = [66, 84, 72, 94, 78, 88, 70], out = "";
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon); d.setDate(mon.getDate() + i);
      var key = ymd(d), isToday = key === today();
      var lit = S.days.indexOf(key) >= 0;
      var winCls = "win" + (lit ? (pendingToday && isToday ? " pending" : " on") : "");
      var x = 12 + i * 97, w = 80, base = 112, h = H[i], top = base - h;
      out += '<rect class="roof" x="' + (x + w - 24) + '" y="' + (top - 9) + '" width="9" height="14"/>';
      out += '<polygon class="roof" points="' + (x - 3) + "," + (top + 16) + " " + (x + 9) + "," + top + " " + (x + w - 9) + "," + top + " " + (x + w + 3) + "," + (top + 16) + '"/>';
      out += '<rect class="' + winCls + '" x="' + (x + w / 2 - 6) + '" y="' + (top + 4) + '" width="12" height="9" rx="1.5"/>';
      out += '<rect class="bld" x="' + x + '" y="' + (top + 16) + '" width="' + w + '" height="' + (h - 16) + '"/>';
      for (var y = top + 26; y + 16 <= base - 8; y += 24) {
        for (var c = 0; c < 3; c++) out += '<rect class="' + winCls + '" x="' + (x + 11 + c * 23) + '" y="' + y + '" width="12" height="15" rx="1.5"/>';
      }
      out += '<text class="day' + (isToday ? " today" : "") + '" x="' + (x + w / 2) + '" y="' + (base + 24) + '" text-anchor="middle">' + (isToday ? "Today" : DAYS[i]) + "</text>";
    }
    out += '<rect class="street" x="0" y="112" width="700" height="3"/>';
    return '<svg class="skyline" viewBox="0 0 700 142" role="img" aria-label="This week: one building for each day. Windows light up on days you practised.">' + out + "</svg>";
  }

  function daysThisWeek() { var m = ymd(monday()); return S.days.filter(function (d) { return d >= m; }).length; }

  /* ── home ── */
  function homeHTML() {
    var dueN = C.items.filter(function (it) { return isDue(it.id); }).length;
    var nextU = C.units.filter(function (u) { return u.status === "next"; })[0];
    var practisedToday = S.days.indexOf(today()) >= 0;
    var nights = daysThisWeek();
    var h = '<div class="wrap">';
    h += '<header class="masthead"><h1>Rooftop English</h1><p>' + (practisedToday ? "Your window is lit tonight. Fancy another round?" : "Ten minutes on the rooftops. Light up today’s window.") + "</p></header>";
    h += skyline(false);
    h += '<p class="week-note">' + nights + " of 7 days this week</p>";
    h += '<section class="today" aria-label="Today’s practice"><div style="display:flex;flex-direction:column;gap:8px">';
    h += '<p class="eyebrow">Today’s practice</p><h2>' + (nextU ? esc(nextU.title) + " + a mix" : "A mixed round") + "</h2>";
    h += '<div class="facts"><span><strong>' + LIMIT + "</strong> questions</span><span>about <strong>10</strong> minutes</span>" +
      (dueN ? "<span><strong>" + dueN + "</strong> to look at again</span>" : "") + "</div></div>";
    h += '<button class="btn primary" data-action="start-mix">Start</button></section>';
    if (ui.homeMsg) h += '<p class="hintbox" role="status">' + esc(ui.homeMsg) + "</p>";

    h += '<section style="display:flex;flex-direction:column;gap:12px"><h3>Pick a topic</h3><ul class="units">';
    C.units.forEach(function (u) {
      var items = C.items.filter(function (it) { return it.unit === u.id; });
      var m = items.filter(function (it) { return mastered(it.id); }).length;
      var label = u.status === "next" ? "Coming up · " + u.when : u.status === "review" ? "Look back · " + u.when : "Anytime";
      h += '<li class="unit"><div class="t"><span class="chip ' + u.status + '">' + esc(label) + '</span><span class="name">' + esc(u.title) + '</span><span class="ja">' + esc(u.ja) + "</span></div>";
      h += '<div class="meter"><span>' + m + " / " + items.length + ' secure</span><div class="bar"><i style="width:' + (items.length ? Math.round(m / items.length * 100) : 0) + '%"></i></div></div>';
      h += '<button class="btn ghost small" data-action="start-unit" data-unit="' + esc(u.id) + '">Practise</button></li>';
    });
    h += "</ul></section>";
    h += '<footer class="foot"><button class="linkish" data-action="parent">保護者メモ（For parents）</button><span class="small muted">Questions updated ' + esc(C.version) + "</span></footer>";
    return h + storageWarn() + "</div>";
  }
  function storageWarn() {
    return storageOk ? "" : '<p class="note" role="alert">⚠ この端末では記録を保存できていません（プライベートブラウズ等）。通常のタブで開き直してください。</p>';
  }

  /* ── quiz ── */
  function elapsed() { return Math.floor((Date.now() - sess.start) / 1000); }
  function clock() {
    var left = Math.max(0, MAX_SECS - elapsed());
    return left === 0 ? "Last one" : Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  }
  function topbar() {
    var segs = sess.queue.map(function (p, k) {
      var a = sess.answers[k];
      var cls = a ? (a.ok ? "ok" : "no") : (k === sess.i && sess.phase === "items" ? "cur" : "");
      return '<i class="' + cls + '"></i>';
    }).join("");
    return '<div class="topbar"><button class="btn ghost small" data-action="stop" aria-label="Stop and go back">✕ Stop</button><div class="segs" aria-hidden="true">' + segs + '</div><span class="timer" id="timer">' + clock() + "</span></div>";
  }
  function fmtQ(q, fill) {
    return esc(q).replace("___", fill == null ? '<span class="blank">&nbsp;</span>' : '<span class="blank filled">' + esc(fill) + "</span>");
  }

  function quizHTML() {
    var h = '<div class="wrap">' + topbar() + storageWarn() + '<div class="stage">';
    if (sess.phase === "speak") {
      h += '<div class="speak"><p class="eyebrow">Your turn · say it out loud</p><p class="q">' + esc(sess.speak) + '</p><p class="muted">No typing — say it to yourself, or to someone at home.</p>';
      h += '<div class="row"><button class="btn primary" data-action="spoke">I said it!</button><button class="btn ghost" data-action="skip-speak">Skip</button></div></div>';
      return h + "</div></div>";
    }
    var cur = sess.queue[sess.i], it = byId[cur.id];
    var sk = C.skills[it.skill] || { en: it.skill };
    var tag = cur.why === "review" ? " · Back again" : cur.why.indexOf("followup") === 0 ? " · One more try at this skill" : "";
    h += '<p class="eyebrow">' + esc(sk.en) + esc(tag) + "</p>";
    h += it.type === "card" ? cardHTML(it) : mcHTML(it, cur);
    return h + "</div></div>";
  }

  function mcHTML(it, cur) {
    if (!cur.order) cur.order = shuffle(it.options.map(function (_, k) { return k; }));
    var ans = ui.answered;
    var two = it.options.every(function (o) { return o.length <= 16; });
    var h = '<p class="q">' + fmtQ(it.q, ans ? it.options[it.a] : null) + "</p>";
    h += '<div class="opts' + (two ? " two" : "") + '">';
    cur.order.forEach(function (oi, k) {
      var cls = "opt", mark = "";
      if (ans) {
        if (oi === it.a) { cls += " correct"; mark = '<span class="mark" aria-label="correct answer">✓</span>'; }
        else if (k === ans.k) { cls += " wrong"; mark = '<span class="mark" aria-label="your answer">✗</span>'; }
        else cls += " dim";
      }
      h += '<button class="' + cls + '" data-action="choose" data-k="' + k + '"' + (ans ? " disabled" : "") + '><span class="key">' + "ABCD".charAt(k) + '</span><span class="txt">' + esc(it.options[oi]) + "</span>" + mark + "</button>";
    });
    h += "</div>";
    if (ans) {
      h += '<div class="feedback ' + (ans.ok ? "ok" : "no") + '" role="status"><p class="fb-title">' + esc(ans.title) + "</p>";
      if (!ans.ok) h += "<p>The answer is <strong>" + esc(it.options[it.a]) + "</strong>.</p>";
      h += "<p>" + esc(it.why) + "</p>";
      if (it.hint) h += '<p class="small muted">ヒント：' + esc(it.hint) + "</p>";
      h += '<button class="btn primary" data-action="next">' + (isLast() ? "Finish" : "Next") + " →</button></div>";
    } else if (it.hint) {
      h += ui.hint ? '<div class="hintbox">' + esc(it.hint) + "</div>" : '<div><button class="btn ghost small" data-action="hint">ヒント（日本語）</button></div>';
    }
    return h;
  }

  function cardHTML(it) {
    var re = new RegExp("\\b(" + it.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "i");
    var ex = esc(it.ex).replace(re, "<strong>$1</strong>");
    var h = '<div class="card"><p class="word">' + esc(it.word) + '</p><p class="ex">“' + ex + "”</p>";
    if (!ui.revealed) {
      h += '<p class="muted">What do you think it means? Say it in your own words, then check.</p>';
      h += '<div class="row"><button class="btn primary" data-action="reveal">Show meaning</button></div></div>';
    } else {
      h += '<p class="def">' + esc(it.def) + '</p><p class="ja">' + esc(it.ja) + "</p>";
      h += '<div class="row"><button class="btn good" data-action="card-yes">I knew it ✓</button><button class="btn ghost" data-action="card-no">Still learning</button></div></div>';
    }
    return h;
  }

  function isLast() { return sess.i + 1 >= sess.queue.length || elapsed() >= MAX_SECS; }

  var PRAISE = ["Spot on!", "Exactly right.", "Nicely done.", "Yes — well spotted.", "Perfect."];
  var NOT = ["Not quite.", "Close, but no.", "Not this time."];

  function answer(ok, extra) {
    var cur = sess.queue[sess.i];
    if (cur.follow) {
      S.follow = S.follow.filter(function (f) { return !(f.skill === cur.follow.skill && f.from === cur.follow.from); });
    }
    record(cur.id, ok);
    sess.answers[sess.i] = { id: cur.id, ok: ok, pick: extra };
  }

  function advance() {
    if (elapsed() >= MAX_SECS) { finish(); return; }   // 10分を過ぎたら話す課題も出さずに終わる
    if (isLast()) {
      if (sess.speak && sess.phase !== "speak") { sess.phase = "speak"; ui = {}; render(); window.scrollTo(0, 0); return; }
      finish(); return;
    }
    sess.i++; ui = {}; render(); window.scrollTo(0, 0);
  }

  function finish() {
    var res = sess.answers.filter(Boolean);
    if (res.length) {
      S.sessions.push({ d: today(), t: sess.start, unit: sess.mode === "mix" ? "mix" : sess.unit, secs: elapsed(), res: res.map(function (a) { return [a.id, a.ok ? 1 : 0]; }) });
      if (S.sessions.length > 300) S.sessions.shift();
      save();
    }
    go(res.length ? "end" : "home");
  }

  /* ── end ── */
  function endHTML() {
    var res = sess.answers.filter(Boolean);
    var ok = res.filter(function (a) { return a.ok; }).length;
    var missed = res.filter(function (a) { return !a.ok; });
    var timeUp = elapsed() >= MAX_SECS && res.length < sess.queue.length;
    var h = '<div class="wrap"><header class="masthead"><p class="eyebrow">' + (timeUp ? "Ten minutes — time’s up" : "Round complete") + "</p><h1>" +
      (ok === res.length ? "A perfect round." : ok / res.length >= 0.7 ? "Lovely work tonight." : "Good effort — that’s how words stick.") + "</h1></header>";
    h += '<p class="score">' + ok + " <span>/ " + res.length + " right</span></p>";
    h += skyline(true);
    if (missed.length) {
      h += '<section style="display:flex;flex-direction:column;gap:12px"><h3>Worth another look</h3><ul class="recap">';
      missed.forEach(function (a) {
        var it = byId[a.id];
        h += "<li><span>" + (it.type === "card" ? "<strong>" + esc(it.word) + "</strong> — " + esc(it.def) : fmtQ(it.q, null)) + "</span>" +
          (it.type === "card" ? "" : '<span class="a">✓ ' + esc(correctText(it)) + "</span>") + "</li>";
      });
      h += '</ul><p class="muted small">These will come back in a day or two — with a different question on the same skill.</p></section>';
    }
    h += '<div class="row"><button class="btn primary" data-action="home">Back to the rooftops</button></div></div>';
    return h;
  }

  /* ── parent (Japanese) ── */
  function summarize() {
    var m = ymd(monday());
    var since = addDays(-30);
    var week = S.sessions.filter(function (s) { return s.d >= m; });
    var mins = Math.round(week.reduce(function (a, s) { return a + (s.secs || 0); }, 0) / 60);
    var wr = 0, wt = 0, skills = {};
    S.sessions.forEach(function (s) {
      s.res.forEach(function (r) {
        var it = byId[r[0]]; if (!it) return;
        if (s.d >= m) { wt++; wr += r[1]; }
        if (s.d >= since) {
          var k = skills[it.skill] || (skills[it.skill] = { right: 0, total: 0 });
          k.total++; k.right += r[1];
        }
      });
    });
    var missed = Object.keys(S.items).filter(function (id) { return byId[id] && S.items[id].wrong > 0; })
      .sort(function (a, b) { return S.items[b].wrong - S.items[a].wrong || S.items[a].right - S.items[b].right; })
      .slice(0, 8).map(function (id) { return { id: id, wrong: S.items[id].wrong, right: S.items[id].right }; });
    return { days: daysThisWeek(), sessions: week.length, minutes: mins, accuracy: wt ? Math.round(wr / wt * 100) : null, skills: skills, missed: missed };
  }

  function exportText() {
    return JSON.stringify({ app: "rooftop-english", content: C.version, exported: new Date().toISOString(), summary: summarize(), state: S });
  }

  function parentHTML() {
    var sm = summarize();
    var h = '<div class="wrap"><div class="row" style="justify-content:space-between"><button class="btn ghost small" data-action="home">← 戻る</button></div>' + storageWarn();
    h += '<header class="masthead"><p class="eyebrow">For parents</p><h1>保護者メモ</h1><p>学校の宿題とは別の、自主練習用です。宿題の答えはここに入れないでください（学校方針：宿題は本人だけで・親は直さない）。</p></header>';
    h += '<section class="panel"><h3>今週</h3><div class="stats">' +
      '<div class="stat"><b>' + sm.days + '</b><span>取り組んだ日</span></div>' +
      '<div class="stat"><b>' + sm.sessions + '</b><span>回数</span></div>' +
      '<div class="stat"><b>' + sm.minutes + '</b><span>合計（分）</span></div>' +
      '<div class="stat"><b>' + (sm.accuracy == null ? "—" : sm.accuracy + "%") + '</b><span>正答率</span></div></div></section>';

    h += '<section class="panel"><h3>技能別（直近30日）</h3>';
    var keys = Object.keys(C.skills).filter(function (k) { return sm.skills[k]; });
    if (!keys.length) h += '<p class="muted">まだ記録がありません。</p>';
    keys.forEach(function (k) {
      var s = sm.skills[k], p = Math.round(s.right / s.total * 100);
      h += '<div class="skill-row"><span>' + esc(C.skills[k].ja) + '</span><div class="bar"><i class="' + (p < 60 ? "low" : p < 80 ? "mid" : "hi") + '" style="width:' + p + '%"></i></div><span class="num">' + p + "% · " + s.right + "/" + s.total + "</span></div>";
    });
    h += '<p class="note">60%未満（赤）は要練習。間違えた技能は、次回に同じ技能の別の問題が自動で出ます。</p></section>';

    h += '<section class="panel"><h3>よく間違える問題</h3>';
    if (!sm.missed.length) h += '<p class="muted">まだありません。</p>';
    else {
      h += '<ul class="missed">';
      sm.missed.forEach(function (m) {
        var it = byId[m.id];
        h += "<li><span>" + esc(promptText(it)).slice(0, 140) + '<br><span class="small" style="color:var(--good)">正解：' + esc(correctText(it)) + '</span></span><span class="cnt">×' + m.wrong + "</span></li>";
      });
      h += "</ul>";
    }
    h += "</section>";

    h += '<section class="panel"><h3>問題の出どころ</h3><ul class="src">';
    C.units.forEach(function (u) { h += "<li><strong>" + esc(u.title) + "</strong>：" + esc(u.source) + "</li>"; });
    h += '</ul><p class="note">問題はすべて自作の例文です（本の本文は使っていません）。毎週金曜のニュースレターを読んだあと、AIが「来週の予習」を差し替えます。</p></section>';

    h += '<section class="panel"><h3>記録の書き出し・バックアップ</h3>';
    h += '<p class="note">記録はこのiPadの中だけに保存されます。週に1回「コピー」して Claude に貼ると、つまずきを次の週の問題に反映します。機種変更・データ消去の前にもコピーして保存してください。</p>';
    h += '<textarea id="exp" readonly>' + esc(exportText()) + "</textarea>";
    h += '<div class="row"><button class="btn primary small" data-action="copy">コピー</button>' + (ui.msg ? '<span class="msg">' + esc(ui.msg) + "</span>" : "") + "</div>";
    h += '<p class="note">バックアップから戻す：下に貼り付けて「読み込む」。</p><textarea id="imp" placeholder="ここに貼り付け"></textarea>';
    h += '<div class="row"><button class="btn ghost small" data-action="import">読み込む</button>' + (ui.imsg ? '<span class="msg">' + esc(ui.imsg) + "</span>" : "") + "</div>";
    h += '<div class="row" style="margin-top:8px">' + (ui.resetArmed
      ? '<button class="btn danger small" data-action="reset-confirm">本当にすべての記録を消す</button><button class="btn ghost small" data-action="reset-cancel">やめる</button>'
      : '<button class="linkish" data-action="reset">記録をリセット…</button>') + "</div></section>";
    return h + "</div>";
  }

  /* ── events ── */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    var a = el.getAttribute("data-action");
    if (a === "start-mix") startSession(buildMix());
    else if (a === "start-unit") startSession(buildUnit(el.getAttribute("data-unit")));
    else if (a === "stop") finish();
    else if (a === "home") { sess = null; ui = {}; go("home"); }
    else if (a === "parent") { ui = {}; go("parent"); }
    else if (a === "hint") { ui.hint = true; render(); }
    else if (a === "choose") {
      if (ui.answered) return;
      var cur = sess.queue[sess.i], it = byId[cur.id], k = +el.getAttribute("data-k");
      var ok = cur.order[k] === it.a;
      ui.answered = { k: k, ok: ok, title: (ok ? PRAISE : NOT)[Math.floor(Math.random() * (ok ? PRAISE.length : NOT.length))] };
      answer(ok, it.options[cur.order[k]]);
      render();
    }
    else if (a === "next") advance();
    else if (a === "reveal") { ui.revealed = true; render(); }
    else if (a === "card-yes" || a === "card-no") { answer(a === "card-yes", a); advance(); }
    else if (a === "spoke" || a === "skip-speak") { if (a === "spoke") { S.spoken++; save(); } finish(); }
    else if (a === "copy") {
      var ta = document.getElementById("exp"), txt = ta.value;
      var done = function () { ui.msg = "コピーしました"; render(); };
      var fallback = function () {
        try { ta.removeAttribute("readonly"); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length); var okc = document.execCommand("copy"); ta.setAttribute("readonly", ""); if (okc) return done(); } catch (err) {}
        ui.msg = "自動コピーできませんでした。枠内を長押し →「すべてを選択」→「コピー」"; render();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
    }
    else if (a === "import") {
      try {
        var obj = JSON.parse(document.getElementById("imp").value);
        if (!obj || obj.app !== "rooftop-english" || !validState(obj.state)) throw new Error("bad");
        var prev = S;
        S = normalize(obj.state); save();
        if (!storageOk) { S = prev; ui = { imsg: "保存できませんでした。記録は元のままです。" }; render(); return; }
        ui = { imsg: "読み込みました" }; render();
      } catch (err) { ui.imsg = "読み込めませんでした。コピーした文字列を全部そのまま貼ってください。"; render(); }
    }
    else if (a === "reset") { ui.resetArmed = true; render(); }
    else if (a === "reset-cancel") { ui.resetArmed = false; render(); }
    else if (a === "reset-confirm") { S = fresh(); save(); ui = { msg: "" }; go("home"); }
  });

  setInterval(function () {
    if (view !== "quiz" || !sess) return;
    var t = document.getElementById("timer");
    if (t) { t.textContent = clock(); t.classList.toggle("over", elapsed() >= MAX_SECS); }
  }, 1000);

  try { localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); } catch (e) { storageOk = false; }
  render();
})();
</script>

</body>
</html>
